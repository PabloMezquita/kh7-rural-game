<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#D62839">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KH7 Rural Games">
<title>KH7 Rural Games</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
  /* ===== Theme tokens (light by default, dark via [data-theme=dark]) ===== */
  :root{
    --bg:#FFF4DE; --ink:#1D1A16; --card:#FFFFFF; --muted:#6B645B; --soft:#FFE7B8; --line:#1D1A16; --sh:#1D1A16;
    --dash:#E5DAC6; --panel:#1D1A16; --panel-ink:#FFFFFF; --input:#FFFFFF;
    --red:#D62839; --yellow:#FFC93C; --green:#1F8A70; --blue:#2F6FEB;
    --radius:14px;
  }
  [data-theme=dark]{
    --bg:#15120F; --ink:#F3EBDD; --card:#231F1A; --muted:#A99F90; --soft:#3A2F20; --line:#8F8577; --sh:#000;
    --dash:#3B342C; --panel:#0B0907; --panel-ink:#F3EBDD; --input:#2C2721;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
  body{min-height:100vh}
  #app{max-width:540px;margin:0 auto;padding:0 14px 120px}
  h1,h2,h3,.display{font-family:'Bungee',system-ui,sans-serif;font-weight:400;letter-spacing:.3px;line-height:1.1}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}

  /* ===== Generic components ===== */
  .card{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);box-shadow:4px 4px 0 var(--sh);padding:14px;margin-bottom:14px}
  .card.flat{box-shadow:none}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  .hint{font-size:13px;color:var(--muted);margin:-6px 2px 14px}
  .sec{font-size:15px;margin:22px 2px 10px;text-transform:uppercase}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700;background:var(--card);box-shadow:3px 3px 0 var(--sh);transition:transform .06s,box-shadow .06s;text-align:center}
  .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--sh)}
  .btn.primary{background:var(--red);color:#fff}
  .btn.yellow{background:var(--yellow);color:#1D1A16}
  .btn.green{background:var(--green);color:#fff}
  .btn.blue{background:var(--blue);color:#fff}
  .btn.ghost{background:transparent;box-shadow:none}
  .btn.block{width:100%;margin-bottom:12px}
  .btn.sm{padding:6px 10px;font-size:14px;border-radius:10px;box-shadow:2px 2px 0 var(--sh)}
  .btn:disabled{opacity:.4;pointer-events:none}
  .row{display:flex;gap:10px;align-items:center}
  .row.wrap{flex-wrap:wrap}
  .grow{flex:1;min-width:0}
  .badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;border:1.5px solid var(--line);white-space:nowrap}
  .st-open{background:#C8F2DF;color:#1D1A16}.st-closed{background:#E4E0DA;color:#1D1A16}.st-drawn{background:#D6E4FF;color:#1D1A16}.st-live{background:var(--red);color:#fff}.st-done{background:var(--panel);color:var(--panel-ink)}
  .chip{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border:1.5px solid var(--line);border-radius:99px;padding:4px 10px;font-size:14px;margin:0 6px 6px 0}
  .chip.me{background:var(--yellow);color:#1D1A16;font-weight:700}
  .chip.off{opacity:.45}
  .tog{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--line);border-radius:99px;padding:6px 12px;font-weight:700;font-size:14px;background:var(--card);margin:0 6px 6px 0}
  .tog.on{background:var(--yellow);color:#1D1A16}
  .lvl{font-size:12px;font-weight:700;background:var(--panel);color:var(--panel-ink);border-radius:6px;padding:1px 5px;margin-left:4px}
  .guest{font-size:12px}
  .av{width:1.45em;height:1.45em;border-radius:50%;object-fit:cover;vertical-align:-.4em;border:1.5px solid var(--line);margin-right:3px}
  .avatar img,.av-big img{width:100%;height:100%;border-radius:50%;object-fit:cover}
  .av-big{width:60px;height:60px;font-size:32px;overflow:hidden}
  .poster .logo{width:84px;height:84px;border-radius:20px;border:3px solid #1D1A16;box-shadow:3px 3px 0 #1D1A16;margin:0 auto 10px;display:block;background:#fff}
  .photo-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  input[type=text],input[type=number],input[type=time],input[type=password],input[type=tel],input:not([type]),select,textarea{width:100%;border:2px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--input);min-width:0}
  textarea{resize:vertical;min-height:70px}
  label{display:block;font-size:13px;font-weight:700;margin-bottom:10px}
  label input,label select,label textarea{margin-top:4px;font-weight:400;font-size:16px}
  .live-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);margin-right:6px;animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.25}}
  .warn{background:#FFF0C2;color:#1D1A16;border:1.5px dashed #1D1A16;border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:12px}
  .toggle{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin:0 0 8px}
  .toggle input{width:auto;margin:0}

  /* ===== Header, banners, nav, FAB ===== */
  .top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 0 10px;border-bottom:2px solid var(--line);margin-bottom:16px}
  .top .title{flex:1;font-family:'Bungee';font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .avatar{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--yellow);display:grid;place-items:center;font-size:20px;position:relative;flex-shrink:0}
  .avatar .adm{position:absolute;right:-6px;bottom:-4px;font-size:13px}
  .icon-btn{border:2px solid var(--line);background:var(--card);border-radius:10px;width:38px;height:38px;font-size:18px;display:grid;place-items:center;flex-shrink:0}
  .icon-btn.sm{width:32px;height:32px;font-size:15px}
  nav#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
  nav#nav:empty{display:none}
  nav#nav .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
  nav#nav button{background:none;border:0;color:#cfc8bd;display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:700;padding:4px 0;border-radius:10px;position:relative}
  nav#nav button span{font-size:21px;line-height:1.2}
  nav#nav button.on{background:var(--yellow);color:#1D1A16}
  nav#nav button i{position:absolute;top:0;right:18%;background:var(--red);color:#fff;font-style:normal;font-size:10px;border-radius:99px;padding:0 5px}
  #fab{position:fixed;right:max(16px, calc(50% - 254px));bottom:calc(84px + env(safe-area-inset-bottom));z-index:31;width:62px;height:62px;border-radius:50%;border:3px solid #1D1A16;background:var(--yellow);font-size:30px;box-shadow:3px 3px 0 #1D1A16;display:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  #fab.show{display:grid;place-items:center}
  #fab small{position:absolute;bottom:-4px;right:-4px;background:var(--red);color:#fff;border:2px solid #1D1A16;border-radius:99px;font-size:11px;font-weight:700;padding:0 5px;font-family:'DM Sans'}
  .ribbon{background:var(--panel);color:var(--yellow);font-size:11px;font-weight:700;text-align:center;padding:5px;letter-spacing:.5px}
  .ribbon.red{background:var(--red);color:#fff}
  .banner{background:var(--yellow);color:#1D1A16;border-bottom:2px solid #1D1A16;padding:8px 14px;display:flex;gap:10px;align-items:center;justify-content:center;font-weight:700;font-size:14px;cursor:pointer}
  .notif{display:flex;gap:10px;align-items:center;background:var(--soft);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px}
  .notif .x{background:none;border:0;font-size:18px;color:var(--muted)}

  /* ===== Login / setup / maintenance ===== */
  .login{min-height:calc(100vh - 40px);display:flex;flex-direction:column;justify-content:center;padding:30px 0}
  .poster{background:var(--red);color:#fff;border:3px solid #1D1A16;border-radius:20px;box-shadow:6px 6px 0 #1D1A16;padding:26px 20px;text-align:center;margin-bottom:22px}
  .poster h1{font-size:34px;color:var(--yellow);text-shadow:3px 3px 0 #1D1A16}
  .poster .sub{font-weight:700;margin-top:8px}
  .poster .icons{font-size:26px;letter-spacing:6px;margin-bottom:10px}
  .pick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
  .pick-grid button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 4px;box-shadow:3px 3px 0 var(--sh);font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis}
  .pick-grid button b{display:block;font-size:28px;font-weight:400}
  .emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:6px 0 12px}
  .emoji-grid button{font-size:22px;border:2px solid transparent;background:var(--card);border-radius:10px;padding:4px 0}
  .emoji-grid button.on{border-color:var(--line);background:var(--yellow)}
  .pin-dots{display:flex;justify-content:center;gap:14px;margin:16px 0 20px}
  .pin-dots span{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:var(--card)}
  .pin-dots span.on{background:var(--ink)}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:0 auto 14px}
  .keypad button{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:14px 0;font-family:'Bungee';font-size:24px;box-shadow:3px 3px 0 var(--sh)}
  .keypad button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--sh)}
  .maint{min-height:80vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px}
  .maint .big{font-size:70px;animation:spin 3s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ===== Home ===== */
  .hero{background:var(--panel);color:var(--panel-ink);border-radius:18px;padding:18px;margin-bottom:16px;border:2px solid var(--line);box-shadow:4px 4px 0 var(--red)}
  .hero h1{font-size:26px;color:var(--yellow)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  .stat{background:rgba(255,255,255,.08);border-radius:12px;padding:8px;text-align:center}
  .stat b{display:block;font-family:'Bungee';font-size:22px;color:var(--yellow)}
  .stat small{font-size:12px;color:#d9d2c7}
  .now{background:var(--yellow);color:#1D1A16}
  .now .lbl{font-size:12px;font-weight:700;text-transform:uppercase;opacity:.75}
  .now .big{font-family:'Bungee';font-size:21px;margin:4px 0}
  .now .btn:not(.primary){background:#fff;color:#1D1A16;border-color:#1D1A16;box-shadow:3px 3px 0 #1D1A16}
  .agenda-day{font-family:'Bungee';font-size:14px;margin:18px 2px 8px}
  .agenda-day:first-child{margin-top:0}
  .ag-item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1.5px dashed var(--dash)}
  .ag-item:last-child{border-bottom:0}
  .ag-time{font-weight:700;font-size:14px;width:46px;flex-shrink:0}
  .ag-icon{font-size:22px;width:30px;text-align:center;flex-shrink:0}
  .ag-name{flex:1;font-weight:500;min-width:0}
  .clickable{cursor:pointer}

  /* ===== Activities ===== */
  .filters{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}
  .filters button{border:2px solid var(--line);border-radius:99px;padding:6px 14px;background:var(--card);font-weight:700;white-space:nowrap}
  .filters button.on{background:var(--panel);color:var(--panel-ink)}
  .act-card{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
  .act-icon{font-size:30px;width:50px;height:50px;flex-shrink:0;border:2px solid var(--line);border-radius:12px;display:grid;place-items:center;background:var(--soft)}
  .act-name{font-family:'Bungee';font-size:17px}
  .act-meta{font-size:13px;color:var(--muted);margin:3px 0 7px}
  .act-head{display:flex;gap:14px;align-items:center}
  .act-head .act-icon{width:64px;height:64px;font-size:38px}
  .admin-box{background:rgba(47,111,235,.09);border-style:dashed}
  .admin-box h3{font-size:13px;margin-bottom:10px;color:var(--blue)}

  /* ===== Tables & lists ===== */
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{font-size:11px;text-transform:uppercase;text-align:left;color:var(--muted);padding:4px 4px 6px}
  td{padding:7px 4px;border-top:1.5px solid var(--dash)}
  td.num,th.num{text-align:center;width:38px}
  .rank-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1.5px dashed var(--dash)}
  .rank-row:last-child{border-bottom:0}
  .pos{font-family:'Bungee';width:30px;text-align:center;font-size:16px;flex-shrink:0}
  .rank-row .val{font-family:'Bungee';font-size:17px;white-space:nowrap}
  .rank-row .val small{font-family:'DM Sans';font-size:12px;color:var(--muted);margin-left:3px}
  .rank-row.me{background:var(--soft);border-radius:10px;padding-left:4px;padding-right:4px}
  .pair-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1.5px dashed var(--dash);flex-wrap:wrap}
  .pair-row:last-child{border-bottom:0}
  .pair-row select{flex:1;min-width:120px;font-size:14px;padding:6px}
  .pair-n{font-family:'Bungee';width:24px}
  .round-l{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--muted);margin:12px 2px 6px}
  .match-card{display:flex;align-items:center;gap:10px;cursor:pointer;padding:12px}
  .match-card .teams{flex:1;font-size:14px}
  .match-card .teams div{display:flex;justify-content:space-between;gap:8px}
  .match-card .teams .w{font-weight:700}
  .match-card.live{border-color:var(--red);box-shadow:4px 4px 0 var(--red)}
  .match-card .sc{font-family:'Bungee'}

  /* ===== Brackets ===== */
  .bk{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px}
  .bk-col{min-width:150px;max-width:170px;display:flex;flex-direction:column;justify-content:space-around;gap:10px}
  .bk-col h4{font-size:11px;text-transform:uppercase;color:var(--muted);text-align:center}
  .bk-m{border:2px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden;box-shadow:2px 2px 0 var(--sh)}
  .bk-m.live{border-color:var(--red);box-shadow:2px 2px 0 var(--red)}
  .bk-m.tap{cursor:pointer}
  .bk-r{display:flex;justify-content:space-between;gap:6px;padding:6px 8px;font-size:13px;width:100%;border:0;background:var(--card);text-align:left}
  .bk-r+.bk-r{border-top:1.5px solid var(--dash)}
  .bk-r.w{background:var(--green);color:#fff;font-weight:700}
  .bk-r.bye{color:var(--muted);font-style:italic}
  .bk-r .s{font-family:'Bungee'}
  .bk-r .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bk-m select{font-size:13px;padding:4px;border-radius:0;border:0;border-bottom:1.5px solid var(--dash)}
  .champ{background:var(--yellow);color:#1D1A16;font-family:'Bungee';text-align:center;font-size:16px}

  /* ===== Match detail & result sheet ===== */
  .match-head{font-family:'Bungee';font-size:14px;color:var(--muted);margin-bottom:10px}
  .scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;background:var(--panel);color:var(--panel-ink);gap:6px}
  .sb-team{padding:8px 0;border-radius:10px}
  .sb-team.win{background:var(--green)}
  .sb-name{font-weight:700;font-size:14px;min-height:38px}
  .sb-big{font-family:'Bungee';font-size:56px;color:var(--yellow);line-height:1}
  .sb-vs{font-family:'Bungee';color:var(--red);font-size:18px}
  .stp{display:inline-flex;align-items:center;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
  .stp button{border:0;background:var(--soft);width:40px;height:40px;font-size:22px;font-weight:700}
  .stp b{min-width:40px;text-align:center;font-family:'Bungee';font-size:20px}
  .stp.big button{width:54px;height:54px;font-size:28px}
  .stp.big b{min-width:58px;font-size:32px}
  .res-team{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1.5px dashed var(--dash)}
  .rule{border-top:1.5px dashed var(--dash);padding:12px 0}
  .rule:first-of-type{border-top:0;padding-top:4px}
  .rule-name{font-weight:700}
  .rule-desc{font-size:13px;color:var(--muted);margin:2px 0 8px}
  .use-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0;font-size:14px}
  .eff{display:inline-block;font-size:12px;font-weight:700;background:var(--yellow);color:#1D1A16;border:1.5px solid #1D1A16;border-radius:6px;padding:1px 6px;margin-left:6px}
  .win-banner{background:var(--green);color:#fff;font-family:'Bungee';text-align:center;font-size:18px}

  /* ===== Bingo ===== */
  .ball-zone{background:var(--panel);color:var(--panel-ink);text-align:center}
  .ball{width:120px;height:120px;border-radius:50%;margin:6px auto 10px;display:grid;place-items:center;font-family:'Bungee';font-size:52px;color:#1D1A16;background:radial-gradient(circle at 35% 30%,#fff 0 18%,var(--yellow) 60%,#d99a00);border:3px solid #fff}
  .ball.empty{font-size:20px}
  .prev-balls{display:flex;gap:6px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}
  .prev-balls span{width:34px;height:34px;border-radius:50%;background:#fff;color:#1D1A16;display:grid;place-items:center;font-weight:700;font-size:14px}
  .bcard{width:100%;border-collapse:separate;border-spacing:3px;table-layout:fixed;margin-bottom:10px}
  .bcard td{border:2px solid var(--line);border-radius:8px;height:40px;text-align:center;font-weight:700;font-size:16px;padding:0;background:var(--card);cursor:pointer}
  .bcard td.e{background:repeating-linear-gradient(45deg,var(--soft) 0 4px,var(--card) 4px 8px);cursor:default}
  .bcard td.mk{background:var(--red);color:#fff}
  .board{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
  .board span{font-size:12px;text-align:center;padding:4px 0;border-radius:6px;background:var(--soft);color:var(--muted)}
  .board span.on{background:var(--panel);color:var(--yellow);font-weight:700}
  .claim-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .claim-btns .btn{padding:16px 6px;font-family:'Bungee';font-size:18px}
  .seg{display:inline-flex;border:2px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{border:0;background:var(--card);padding:6px 14px;font-weight:700}
  .seg button+button{border-left:2px solid var(--line)}
  .seg button.on{background:var(--panel);color:var(--panel-ink)}

  /* ===== Drinks ===== */
  .drink-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .drink-btns button{border:2px solid #1D1A16;border-radius:16px;box-shadow:3px 3px 0 #1D1A16;padding:12px 2px 10px;display:flex;flex-direction:column;align-items:center;color:#1D1A16}
  .drink-btns button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #1D1A16}
  .drink-btns .e{font-size:34px;line-height:1.1}
  .drink-btns .n{font-family:'Bungee';font-size:22px}
  .drink-btns small{font-size:11px;font-weight:700;opacity:.7}
  .d-beer{background:#FFE9A8}.d-shot{background:#FFD0C7}.d-cubata{background:#D2F0E6}.d-water{background:#D6E8FF}
  .feed-item{display:flex;gap:8px;align-items:center;font-size:14px;padding:7px 0;border-bottom:1.5px dashed var(--dash)}
  .feed-item:last-child{border-bottom:0}
  .feed-item .t{color:var(--muted);font-size:12px;margin-left:auto;white-space:nowrap}

  /* ===== Shopping, suggestions, more ===== */

<script>
'use strict';

/* =====================================================================
   KH7 RURAL GAMES — weekend tournaments app (v1)
   ---------------------------------------------------------------------
   CONFIGURATION
   1) Paste your Firebase web config below. While it is null the app runs
      in DEMO mode (sample data stored only in this browser).
   2) Bump APP_VERSION on every deploy, then press "Avisar de versión
      nueva" in the organizer panel.
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAXDrUkP8wcjE81khHTiQISVzkF5nOXPs0",
  authDomain: "kh7-rural-games.firebaseapp.com",
  projectId: "kh7-rural-games",
  storageBucket: "kh7-rural-games.firebasestorage.app",

  appId: "1:901457353287:web:ce3c25fc8676c24304ef62",
};
const APP_VERSION = '1.0.0';
const FIREBASE_SDK = '10.12.2';

// Every player is a Firebase Auth account behind the scenes: name → fake e-mail, PIN → password
const EMAIL_DOMAIN = 'ruralgames.app';
const emailOf = pid => `${pid}@${EMAIL_DOMAIN}`;
const pwOf = pin => `rg-${pin}-pin`;                       // Firebase needs ≥ 6 characters

/* ---------- Constants ---------- */
const DAYS = [{id:'vie',label:'Viernes',short:'Vie'},{id:'sab',label:'Sábado',short:'Sáb'},{id:'dom',label:'Domingo',short:'Dom'}];
const DAY_ORDER = {vie:0, sab:1, dom:2};
const DRINKS = {beer:{icon:'🍺',label:'Cerveza'}, shot:{icon:'🥃',label:'Chupito'}, cubata:{icon:'🍹',label:'Cubata'}, water:{icon:'💧',label:'Agua'}};
const ALCOHOL = ['beer','shot','cubata'];
const STATUS = {
  open:{label:'Inscripción abierta',cls:'st-open'}, closed:{label:'Inscripción cerrada',cls:'st-closed'},
  drawn:{label:'Sorteado',cls:'st-drawn'}, live:{label:'En juego',cls:'st-live'}, done:{label:'Terminado',cls:'st-done'}
};
const KINDS = {pairs:'Por parejas', score:'Marca individual', knockout:'Eliminatoria 1 vs 1', tables:'Mesas (3-4 jugadores)',
               poker:'Torneo de póker', bingo:'Bingo', trivial:'Trivial', event:'Evento de agenda (sin inscripción)'};
const SPORTS = {padel:'Pádel', mus:'Mus', beerpong:'Beer pong'};
const FORMATS = {bracket:'Cuadro eliminatorio con consolación', league:'Liguilla (todos contra todos)'};
const SPORT_DEF = {padel:{target:4, unit:'juegos', minutes:35}, mus:{target:2, unit:'juegos', minutes:40}, beerpong:{target:10, unit:'vasos', minutes:15}};
const PTS = [10,7,5,3,1];                                   // base points per finishing position (× activity weight)
const LATE_JOIN = ['bingo','score','trivial'];              // anyone can join these after they start
const LEVELS = ['','Nunca he jugado','Peloteo','Me defiendo','Bueno','Profesional'];
const EMOJIS = ['😎','🤠','🦁','🐯','🐻','🦊','🐸','🐙','🦄','🐲','👽','🤖','🧔','👩','🥷','🐼'];
const BLINDS = [[10,20],[25,50],[50,100],[100,200],[150,300],[200,400],[300,600],[500,1000],[1000,2000]];
const LEVEL_SECONDS = 20*60;
const SUG_STATUS = {new:{l:'Nueva',c:'st-open'}, study:{l:'En estudio',c:'st-drawn'}, added:{l:'Añadida ✅',c:'st-done'}, rejected:{l:'Descartada',c:'st-closed'}};
const defaultWeight = (kind, sport) => sport === 'padel' ? 3 : ['pairs','poker','tables','trivial'].includes(kind) ? 2 : 1;

/* ---------- Small helpers ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => o === undefined ? undefined : JSON.parse(JSON.stringify(o));
const shuffle = arr => { const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const toMin = t => { if(!t) return 0; const [h,m] = t.split(':').map(Number); return h*60 + (m||0); };
const adj = t => { const m = toMin(t); return m < 360 ? m + 1440 : m; };              // before 06:00 = the night before
const adjEnd = a => a.end ? (adj(a.end) <= adj(a.start) ? adj(a.end) + 1440 : adj(a.end)) : adj(a.start) + 60;
const fmtClock = s => String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
const fmtTime = ms => { try { return new Date(ms).toLocaleString('es-ES',{weekday:'short',hour:'2-digit',minute:'2-digit'}); } catch(e){ return ''; } };
const fmtHM = ms => { const d = new Date(ms); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
const dayLabel = id => (DAYS.find(d=>d.id===id)||{}).label || id;
const medal = i => ['🥇','🥈','🥉'][i] || (i+1);
const normKey = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const cmpVer = (a,b) => { const x=String(a||'0').split('.').map(Number), y=String(b||'0').split('.').map(Number); for(let i=0;i<3;i++){ if((x[i]||0)!==(y[i]||0)) return (x[i]||0)-(y[i]||0); } return 0; };
const sum = arr => arr.reduce((s,x) => s + (+x || 0), 0);
async function sha256(s){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join(''); }
const LS = {
  get(k, d=null){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} },
};

/* =====================================================================
   DATA LAYER
   All shared state lives in a handful of documents (cheap on the free
   plan: opening the app costs ~6 reads):
     config/main   event settings, codes, admin uid       (public read)
     data/players  {list:{pid:player}}                    (public read)
     data/event    {acts:{}, rules:{}}
     data/bar      {feed:{id:drink}}
     data/social   {shop:{}, sugg:{}, fc:{}}
     data/live     {bingo:{actId:{round,drawn,claims}}}   (small, changes often)
     data/log      {items:{}}                             (read on demand)
     pins/{pid}    PIN copy, only the organizer can read it
     backups/{id}  organizer only
   update() takes dotted field paths, so two phones editing different
   fields never overwrite each other. OP markers = atomic array/delete ops.
   ===================================================================== */
const OP = { union: (...v) => ({__op:'union', v}), remove: (...v) => ({__op:'remove', v}), del: () => ({__op:'del'}) };
const isOp = v => v && typeof v === 'object' && v.__op;

function applyPatch(doc, patch){
  for(const [path, val] of Object.entries(patch)){
    const keys = path.split('.'); let o = doc;
    for(const k of keys.slice(0,-1)){ if(typeof o[k] !== 'object' || o[k] === null) o[k] = {}; o = o[k]; }
    const k = keys[keys.length-1];
    if(!isOp(val)){ o[k] = clone(val); continue; }
    const same = (x,y) => JSON.stringify(x) === JSON.stringify(y);
    if(val.__op === 'union'){ const arr = Array.isArray(o[k]) ? o[k] : []; val.v.forEach(x => { if(!arr.some(y => same(x,y))) arr.push(clone(x)); }); o[k] = arr; }
    if(val.__op === 'remove') o[k] = (Array.isArray(o[k]) ? o[k] : []).filter(y => !val.v.some(x => same(x,y)));
    if(val.__op === 'del') delete o[k];
  }
}

// ---------- Demo adapter: same API, data in localStorage, fake accounts ----------
function makeLocalAdapter(){
  const KEY = 'kh7-rural-games-demo-v4';
  let data = LS.get(KEY);
  const fresh = !data;
  if(!data) data = {docs:{}, accounts:{}};
  const subs = new Set();
  let authCb = null;
  const persist = () => LS.set(KEY, data);
  const fire = s => s.cb(data.docs[s.path] ? clone(data.docs[s.path]) : null);
  const emit = path => setTimeout(() => subs.forEach(s => { if(s.path === path) fire(s); }), 0);
  window.addEventListener('storage', e => {                 // other tabs = other "phones"
    if(e.key === KEY){ data = LS.get(KEY) || {docs:{}, accounts:{}}; subs.forEach(fire); }
    if(e.key === 'rg-demo-session' && authCb) authCb(LS.get('rg-demo-session'));
  });
  const err = code => Object.assign(new Error(code), {code});
  return {
    mode:'demo', fresh,
    listen(path, cb){ const s = {path, cb}; subs.add(s); setTimeout(() => fire(s), 0); return () => subs.delete(s); },
    async get(path){ return clone(data.docs[path] ?? null); },
    async set(path, v){ data.docs[path] = clone(v); persist(); emit(path); },
    async update(path, patch){ if(!data.docs[path]) throw err('not-found'); applyPatch(data.docs[path], patch); persist(); emit(path); },
    async del(path){ delete data.docs[path]; persist(); emit(path); },
    async list(col){ return Object.entries(data.docs).filter(([p]) => p.startsWith(col + '/')).map(([p,v]) => ({...clone(v), id:p.split('/')[1]})); },
    onAuth(cb){ authCb = cb; setTimeout(() => cb(LS.get('rg-demo-session')), 0); },
    async signUp(email, pw){ if(data.accounts[email]) throw err('auth/email-already-in-use'); const u = 'u-' + uid(); data.accounts[email] = {pw, uid:u}; persist(); LS.set('rg-demo-session', u); authCb?.(u); return u; },
    async signIn(email, pw){ const a = data.accounts[email]; if(!a || a.pw !== pw) throw err('auth/invalid-credential'); LS.set('rg-demo-session', a.uid); authCb?.(a.uid); return a.uid; },
    async signOut(){ LS.del('rg-demo-session'); authCb?.(null); },
    async changePw(email, oldPw, newPw){ const a = data.accounts[email]; if(!a || a.pw !== oldPw) throw err('auth/invalid-credential'); a.pw = newPw; persist(); },
    _seedAccount(email, pw, u){ data.accounts[email] = {pw, uid:u}; persist(); },
    reset(){ data = {docs:{}, accounts:{}}; persist(); LS.del('rg-demo-session'); },
  };
}

// ---------- Firebase adapter (Firestore + Auth, loaded from Google's CDN) ----------
async function makeFirebaseAdapter(cfg){
  const base = `https://www.gstatic.com/firebasejs/${FIREBASE_SDK}`;
  const appMod = await import(`${base}/firebase-app.js`);
  const fs = await import(`${base}/firebase-firestore.js`);
  const au = await import(`${base}/firebase-auth.js`);
  const app = appMod.initializeApp(cfg);
  let db;
  // Offline cache: what you do without signal is kept and synced when the connection returns
  try { db = fs.initializeFirestore(app, {localCache: fs.persistentLocalCache({tabManager: fs.persistentMultipleTabManager()})}); }
  catch(e){ db = fs.getFirestore(app); }
  const auth = au.getAuth(app);
  const ref = path => fs.doc(db, ...path.split('/'));
  const conv = v => v.__op === 'union' ? fs.arrayUnion(...v.v) : v.__op === 'remove' ? fs.arrayRemove(...v.v) : fs.deleteField();
  return {
    mode:'firebase', fresh:false,
    listen: (path, cb) => fs.onSnapshot(ref(path), d => cb(d.exists() ? d.data() : null), e => { if(e.code !== 'permission-denied') dbErr(e); }),
    get: async path => { const d = await fs.getDoc(ref(path)); return d.exists() ? d.data() : null; },
    set: (path, v) => fs.setDoc(ref(path), clone(v)),
    update: (path, patch) => fs.updateDoc(ref(path), Object.fromEntries(Object.entries(patch).map(([k,v]) => [k, isOp(v) ? conv(v) : clone(v)]))),
    del: path => fs.deleteDoc(ref(path)),
    list: async col => (await fs.getDocs(fs.collection(db, col))).docs.map(d => ({...d.data(), id:d.id})),
    onAuth: cb => au.onAuthStateChanged(auth, u => cb(u ? u.uid : null)),
    signUp: async (email, pw) => (await au.createUserWithEmailAndPassword(auth, email, pw)).user.uid,
    signIn: async (email, pw) => (await au.signInWithEmailAndPassword(auth, email, pw)).user.uid,
    signOut: () => au.signOut(auth),
    changePw: async (email, oldPw, newPw) => {
      await au.reauthenticateWithCredential(auth.currentUser, au.EmailAuthProvider.credential(email, oldPw));
      await au.updatePassword(auth.currentUser, newPw);
    },
  };
}

let DB = null;
function dbErr(e){ console.error(e); toast('⚠️ ' + (e?.code === 'permission-denied' ? 'No tienes permiso para eso' : 'Problema de conexión: ' + (e?.code || e?.message || e))); }
const W = p => { Promise.resolve(p).catch(dbErr); };                 // fire-and-forget write
const upd = (path, patch) => W(DB.update(path, patch));
function actPatch(id, patch){ const o = {}; for(const [k,v] of Object.entries(patch)) o[`acts.${id}.${k}`] = v; upd('data/event', o); }

   DEFAULT CONTENT
   ===================================================================== */

  r3:{id:'r3', name:'Hidalgo', desc:'Cubata de un trago: juego entero', drink:'cubata', who:'uno', effect:'game', value:1, sports:['padel','mus'], max:1, alt:'Vuelta a la pista corriendo'},
  r4:{id:'r4', name:'Penitencia', desc:'Cerveza entera de un tirón y sumas un vaso', drink:'beer', who:'uno', effect:'plus', value:1, sports:['beerpong'], max:1, alt:'20 flexiones'},

function actDefaults(kind, sport){
  if(kind === 'event') return {};
  const d = {status:'open', max:null, signups:[], weight:defaultWeight(kind, sport)};
  if(kind === 'pairs') Object.assign(d, {sport, format: sport === 'padel' ? 'bracket' : 'league', pairs:[], matches:{}, br:null, cons:null, retired:[],

  if(kind === 'bingo') Object.assign(d, {cards:{}});

}
const mkAct = o => ({desc:'', at:Date.now(), ...actDefaults(o.kind, o.sport), ...o});
const defaultActs = () => [
  mkAct({id:'e-llegada', kind:'event', name:'Llegada y reparto de habitaciones', icon:'🚗', day:'vie', start:'19:00', end:'20:30'}),
  mkAct({id:'a-cata', kind:'score', name:'Cata a ciegas', icon:'🍺', day:'vie', start:'21:00', end:'22:00', unit:'aciertos'}),
  mkAct({id:'a-poker', kind:'poker', name:'Póker', icon:'🃏', day:'vie', start:'22:30', end:'01:30', max:10}),
  mkAct({id:'a-padel', kind:'pairs', sport:'padel', name:'Pádel', icon:'🎾', day:'sab', start:'10:00', end:'19:00', max:16}),
  mkAct({id:'a-flex', kind:'score', name:'Flexiones', icon:'💪', day:'sab', start:'13:30', end:'14:00', unit:'flexiones'}),
  mkAct({id:'a-pulsos', kind:'knockout', name:'Pulsos', icon:'🦾', day:'sab', start:'13:45', end:'14:30', max:16}),
  mkAct({id:'e-comida', kind:'event', name:'Comida', icon:'🥘', day:'sab', start:'14:30', end:'16:30'}),
  mkAct({id:'a-bingo', kind:'bingo', name:'Bingo', icon:'🎱', day:'sab', start:'19:30', end:'20:30'}),
  mkAct({id:'a-trivial', kind:'trivial', name:'Trivial del grupo', icon:'🧠', day:'sab', start:'21:00', end:'22:00'}),

function seedOrder(size){ let o = [1]; while(o.length < size){ const m = o.length*2 + 1; o = o.flatMap(s => [s, m - s]); } return o; }

function deriveBracket(br, prefix, winnerOf, isOut = () => false){

  const rounds = []; let prev = null;
  for(let r = 0, n = br.size/2; n >= 1; r++, n /= 2){
    const row = [];
    for(let i = 0; i < n; i++){
      const a = r === 0 ? br.slots[2*i] : prev[2*i].winner;
      const b = r === 0 ? br.slots[2*i+1] : prev[2*i+1].winner;
      const key = `${prefix}${r}_${i}`;
      let winner = null;
      if(a && b){
        if(dead(a) && dead(b)) winner = 'BYE';
        else if(dead(a)) winner = b;
        else if(dead(b)) winner = a;
        else { const w = winnerOf(key); if(w === a || w === b) winner = w; }

      row.push({key, r, i, a, b, winner, bye: dead(a) || dead(b)});
    }
    rounds.push(row); prev = row;
  }

}

  const groups = [[fin.winner]];
  for(let r = R.length-1; r >= 0; r--){
    const losers = R[r].filter(m => m.winner && m.a && m.b && !m.bye).map(m => m.winner === m.a ? m.b : m.a);
    if(losers.length) groups.push(losers);

function consEntrants(a){

    let first = null;
    for(const row of R){ first = row.find(m => (m.a === pr.id || m.b === pr.id) && !m.bye); if(first) break; }
    if(!first) continue;
    if(!first.winner) return null;
    if(first.winner !== pr.id) out.push(pr.id);

}

}

  for(let r = 0; r < n-1; r++){
    for(let i = 0; i < n/2; i++){ const x = arr[i], y = arr[n-1-i]; if(x && y){ const key = `L${r}_${i}`; out[key] = {key, round:r+1, t:[x,y], status:'pending'}; } }

// ---------- Bingo (Spanish 90 balls: 3×9 card, 15 numbers, 5 per row) ----------
function rng(str){
  let h = 1779033703 ^ str.length;
  for(let i = 0; i < str.length; i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  let s = h >>> 0;
  return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
// Cards are rebuilt from a seed on any phone, so nothing needs storing
function bingoCard(seed){
  const r = rng(seed);
  for(let attempt = 0; attempt < 300; attempt++){
    const cnt = Array(9).fill(1);
    let extra = 6; while(extra){ const c = Math.floor(r()*9); if(cnt[c] < 3){ cnt[c]++; extra--; } }
    const rows = [0,0,0], place = [];
    const cols = [...Array(9).keys()].map(c => ({c, k:r()})).sort((x,y) => cnt[y.c] - cnt[x.c] || x.k - y.k).map(o => o.c);
    let ok = true;
    for(const c of cols){
      const cand = [0,1,2].filter(i => rows[i] < 5).map(i => ({i, k:r()})).sort((x,y) => rows[x.i] - rows[y.i] || x.k - y.k).map(o => o.i);
      if(cand.length < cnt[c]){ ok = false; break; }
      place[c] = cand.slice(0, cnt[c]).sort(); place[c].forEach(i => rows[i]++);
    }
    if(!ok || rows.some(x => x !== 5)) continue;
    const grid = [Array(9).fill(0), Array(9).fill(0), Array(9).fill(0)];
    for(let c = 0; c < 9; c++){
      const lo = c === 0 ? 1 : c*10, hi = c === 8 ? 90 : c*10 + 9, pool = [];
      for(let n = lo; n <= hi; n++) pool.push(n);
      const nums = place[c].map(() => pool.splice(Math.floor(r()*pool.length), 1)[0]).sort((x,y) => x - y);
      place[c].forEach((row,j) => grid[row][c] = nums[j]);
    }
    return grid;
  }
  return null;
}
const cardsOf = (a, pid) => Array.from({length: a.cards?.[pid] || 1}, (_,k) => ({k, grid: bingoCard(`${a.id}|${bingoState(a).round}|${pid}|${k}`)}));
const lineDone = (g, set) => g.some(row => row.every(n => !n || set.has(n)));
const fullDone = (g, set) => g.every(row => row.every(n => !n || set.has(n)));
function roundWinners(b, round, type){
  const cl = (b.claims || []).filter(c => c.round === round && c.type === type && c.ok);

function bingoPoints(a){
  const b = bingoState(a), pts = {};
  for(const r of new Set((b.claims || []).map(c => c.round))){
    roundWinners(b, r, 'line').forEach(p => pts[p] = (pts[p] || 0) + 1);
    roundWinners(b, r, 'bingo').forEach(p => pts[p] = (pts[p] || 0) + 3);
  }
  return pts;
}

// ---------- Rankings ----------
// Groups of tied entries; each entry is a list of player ids (two for a pair)
function activityRanking(a){
  if(a.status !== 'done') return [];
  const byVal = (ids, val) => { const g = []; ids.forEach(id => { const last = g[g.length-1]; if(last && val(last[0][0]) === val(id)) last.push([id]); else g.push([[id]]); }); return g; };
  const pairP = id => pairOf(a, id).p.filter(Boolean);
  switch(a.kind){
    case 'pairs': {
      if(a.format === 'league') return pairStandings(a).filter(r => !isRetired(a)(r.id)).map(r => [r.p.filter(Boolean)]);
      let groups = bracketRanking(padelMain(a)); if(!groups.length) return [];
      const C = padelCons(a), cc = C.length ? C[C.length-1][0].winner : null;
      if(cc && cc !== 'BYE'){ groups = groups.map(g => g.filter(id => id !== cc)).filter(g => g.length); groups.splice(Math.min(3, groups.length), 0, [cc]); }
      return groups.map(g => g.map(pairP));
    }
    case 'score': case 'trivial': { const ids = a.signups.filter(p => a.scores?.[p] != null).sort((x,y) => a.higher ? a.scores[y] - a.scores[x] : a.scores[x] - a.scores[y]); return byVal(ids, id => a.scores[id]); }
    case 'tables': { const ids = a.signups.filter(p => a.vp?.[p] != null).sort((x,y) => a.vp[y] - a.vp[x]); return byVal(ids, id => a.vp[id]); }
    case 'poker': { const alive = a.signups.filter(p => !a.eliminated.includes(p)); return [...(alive.length === 1 ? [[alive]] : []), ...[...a.eliminated].reverse().map(p => [[p]])]; }
    case 'knockout': return bracketRanking(koRounds(a)).map(g => g.map(id => [id]));
    case 'bingo': { const pts = bingoPoints(a); const ids = Object.keys(pts).sort((x,y) => pts[y] - pts[x]); return byVal(ids, id => pts[id]); }
  }
  return [];
}
function generalRanking(){
  const tot = {};
  plist().forEach(p => tot[p.id] = {id:p.id, pts:0, golds:0, silvers:0, guest:!!p.guest});
  for(const a of actsArr()){
    let pos = 0;
    for(const g of activityRanking(a)){
      const pts = (PTS[pos] || 0) * (a.weight || 1);
      g.forEach(entry => entry.forEach(pid => { if(tot[pid]){ tot[pid].pts += pts; if(pos === 0) tot[pid].golds++; if(pos === 1) tot[pid].silvers++; } }));
      pos += g.length;
    }
  }
  return Object.values(tot).sort((a,b) => b.pts - a.pts || b.golds - a.golds);
}

// ---------- Drinks & shopping ----------
const feedArr = () => Object.entries(S.feed).map(([id,d]) => ({...d, id}));
const drinkCount = (pid, kind) => feedArr().filter(d => d.pid === pid && (kind ? d.kind === kind : ALCOHOL.includes(d.kind))).length;
// Adds drinks in one write; returns their ids (for undo)
function addDrinks(list, extra = {}){
  const patch = {}, ids = [];
  for(const d of list){ const id = uid() + ids.length; ids.push(id); patch[`feed.${id}`] = {pid:d.pid, kind:d.kind, at:Date.now(), src:d.src || '', by:myId()}; }
  Object.assign(patch, extra);
  if(Object.keys(patch).length) upd('data/bar', patch);
  return ids;
}
function quickDrink(pid, kind){
  const [id] = addDrinks([{pid, kind}]);
  vibrate(); toast(`${DRINKS[kind].icon} ${pid === myId() ? (kind === 'water' ? '¡Bien hidratado!' : '¡Salud!') : 'Apuntado a ' + shortName(pid)}`, {label:'Deshacer', fn: () => upd('data/bar', {[`feed.${id}`]: OP.del()})});
  if(pid !== myId()) log(`${DRINKS[kind].icon} apuntado a ${shortName(pid)}`);
}
function forecastTotals(){
  const t = {beer:0, cubata:0, shot:0};
  Object.values(S.fc).forEach(f => { t.beer += +f.beer || 0; t.cubata += +f.cubata || 0; t.shot += +f.shot || 0; });
  return t;
}
function shopEstimate(){
  const c = S.config.shop, t = forecastTotals(), k = 1 + (c.margin || 0)/100;
  const beer = Math.ceil(t.beer * k), cub = Math.ceil(t.cubata * k), shot = Math.ceil(t.shot * k);
  return [
    {id:'est-beer', icon:'🍺', name:'Cerveza', n:Math.ceil(beer / c.pack), unit:`packs de ${c.pack}`, note:`${beer} latas`},
    {id:'est-spirits', icon:'🍾', name:'Botellas para cubatas', n:Math.ceil(cub / c.cubataPerBottle), unit:'botellas', note:`${cub} cubatas`},
    {id:'est-mixer', icon:'🥤', name:'Refresco 2 L', n:Math.ceil(cub / c.cubataPerMixer), unit:'botellas', note:''},
    {id:'est-ice', icon:'🧊', name:'Hielo (bolsa 2 kg)', n:Math.ceil(cub / c.cubataPerIce), unit:'bolsas', note:''},
    {id:'est-shots', icon:'🥃', name:'Botellas para chupitos', n:Math.ceil(shot / c.shotPerBottle), unit:'botellas', note:`${shot} chupitos`},
  ];
}
function forecastRows(){
  return Object.entries(S.fc).filter(([id]) => P(id)).map(([id,f]) => { const pred = (+f.beer||0) + (+f.cubata||0) + (+f.shot||0), real = drinkCount(id); return {id, pred, real, diff:real - pred}; });
}

// ---------- Gala awards (computed from the data) ----------
function awards(){
  const out = [], gr = generalRanking();
  const top = (arr, key, min = 1) => { const best = Math.max(...arr.map(x => x[key]), -Infinity); return best >= min ? arr.filter(x => x[key] === best) : []; };
  const champ = gr.filter(r => !r.guest);
  if(champ[0]?.pts > 0) out.push({ic:'🏆', tt:'Campeón del finde', who:[champ[0].id], det:`${champ[0].pts} puntos`});
  if(champ[1]?.pts > 0) out.push({ic:'🥈', tt:'Subcampeón', who:[champ[1].id], det:`${champ[1].pts} puntos`});
  const drinkers = plist().map(p => ({id:p.id, n:drinkCount(p.id), w:drinkCount(p.id,'water'), r:feedArr().filter(d => d.pid === p.id && d.src && ALCOHOL.includes(d.kind)).length}));
  let w = top(drinkers, 'n'); if(w.length) out.push({ic:'🍺', tt:'Rey de la barra', who:w.map(x => x.id), det:`${w[0].n} bebidas`});
  w = top(drinkers, 'r'); if(w.length) out.push({ic:'🍹', tt:'Hidalgo de oro', who:w.map(x => x.id), det:`${w[0].r} reglas de bebida cumplidas`});
  w = top(drinkers, 'w'); if(w.length) out.push({ic:'🐪', tt:'Camello del finde', who:w.map(x => x.id), det:`${w[0].w} aguas`});
  const fr = forecastRows();
  if(fr.length){
    const best = Math.min(...fr.map(r => Math.abs(r.diff)));
    out.push({ic:'🔮', tt:'Profeta', who:fr.filter(r => Math.abs(r.diff) === best).map(r => r.id), det:`Falló por ${best}`});
    const liar = Math.max(...fr.map(r => r.diff)); if(liar > 0) out.push({ic:'🤥', tt:'Mentiroso', who:fr.filter(r => r.diff === liar).map(r => r.id), det:`Se quedó corto por ${liar}`});
  }
  w = top(gr, 'silvers'); if(w.length) out.push({ic:'🥲', tt:'Eterno segundo', who:w.map(x => x.id), det:`${w[0].silvers} segundo${w[0].silvers === 1 ? '' : 's'} puesto${w[0].silvers === 1 ? '' : 's'}`});
  const falses = {}; Object.values(S.live).forEach(b => (b.claims || []).filter(c => !c.ok).forEach(c => falses[c.pid] = (falses[c.pid] || 0) + 1));
  w = top(Object.entries(falses).map(([id,n]) => ({id, n})), 'n'); if(w.length) out.push({ic:'😅', tt:'Cantante en falso', who:w.map(x => x.id), det:`${w[0].n} cante${w[0].n === 1 ? '' : 's'} en falso`});
  const g = gr.filter(r => r.guest && r.pts > 0); if(g[0]) out.push({ic:'🎟️', tt:'Mejor invitado', who:[g[0].id], det:`${g[0].pts} puntos`});
  return out.reverse();                                       // the champion is revealed last
}

const $app = document.getElementById('app');

function scheduleRender(){ if(!renderQueued){ renderQueued = true; requestAnimationFrame(render); } }

// Keeps what the user is typing when a remote change re-renders the page
function captureInputs(){
  document.querySelectorAll('#app [data-draft]').forEach(el => { if(el.id) UI.drafts[el.id] = el.value; });
  const ae = document.activeElement;
  if(ae && ae.id && $app.contains(ae) && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)){ let s = null, e = null; try { s = ae.selectionStart; e = ae.selectionEnd; } catch(_){} return {id:ae.id, v:ae.value, s, e}; }
  return null;
}
function restoreInputs(keep){
  for(const [id, v] of Object.entries(UI.drafts)){ const el = document.getElementById(id); if(el) el.value = v; }
  if(keep){ const el = document.getElementById(keep.id); if(el){ el.value = keep.v; el.focus(); try { if(keep.s != null) el.setSelectionRange(keep.s, keep.e); } catch(_){} } }
}
const clearDrafts = (...ids) => ids.forEach(id => { delete UI.drafts[id]; const el = document.getElementById(id); if(el) el.value = ''; });

function applyTheme(){
  const pref = LS.get('rg-theme', 'auto'), h = new Date().getHours();
  const dark = pref === 'dark' || (pref === 'auto' && (h >= 21 || h < 8 || matchMedia('(prefers-color-scheme: dark)').matches));
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
}

function render(){
  renderQueued = false;
  applyTheme();
  const keep = captureInputs();
  renderRibbons();
  let html, chrome = false;
  if(UI.tab === 'tv' && ME()) html = renderTV();
  else if(S.config === undefined || !S.got.has('players') || S.uid === undefined) html = `<div class="maint"><div class="big">🎾</div><b>Cargando…</b></div>`;
  else if(S.config === null) html = renderSetup();
  else if(!ME()) html = renderLogin();
  else if(S.config.maintenance && !isAdmin()) html = renderMaintenance();
  else {
    chrome = true;
    html = renderHeader();
    if(UI.view?.kind === 'activity' && act(UI.view.id)) html += renderActivity(act(UI.view.id));
    else if(UI.view?.kind === 'match' && act(UI.view.aid)) html += renderMatch(act(UI.view.aid), UI.view.key);
    else html += ({home:renderHome, acts:renderActs, drinks:renderDrinks, shop:renderShop, more:renderMore,
                   rank:renderRank, sugg:renderSugg, me:renderMe, admin:renderAdmin, gala:renderGala})[UI.tab]?.() ?? renderHome();
  }
  $app.innerHTML = html;
  if(UI.modal && ['persona','drinkpick'].includes(UI.modal.kind)) renderModal();   // these sheets show live data
  document.getElementById('nav').innerHTML = chrome ? renderNav() : '';
  const fab = document.getElementById('fab');

  if(chrome) fab.innerHTML = `🍺<small>${drinkCount(myId())}</small>`;

// My match that is on court now, or the next one in the queue
function myTurn(){
  for(const a of actsArr().filter(a => a.kind === 'pairs' && a.status === 'live')){
    const mp = myPair(a); if(!mp) continue;
    const q = orderOfPlay(a); if(!q.length) continue;
    const live = q.filter(x => a.matches?.[x.key]?.status === 'live');
    const mine = live.find(x => x.a === mp.id || x.b === mp.id);
    if(mine) return {a, key:mine.key, live:true};
    if(!live.length && (q[0].a === mp.id || q[0].b === mp.id)) return {a, key:q[0].key, live:false};
  }
  return null;
}

// In-app notifications computed from the data (nothing stored, dismissed per device)

// "What do I do now?" — the single most relevant thing for this person
function renderNowCard(){

  const turn = myTurn();
  if(turn){
    const x = allPairMatches(turn.a).find(z => z.key === turn.key), rival = x.a === myPair(turn.a).id ? x.b : x.a;
    return card(turn.live ? 'Estás jugando' : '¡Os toca!', turn.a.icon, `vs ${esc(pairName(turn.a, rival))}`, esc(x.label),
      `<button class="btn primary block" style="margin:0" data-a="open-match" data-aid="${turn.a.id}" data-key="${turn.key}">${turn.live ? '📝 Apuntar resultado' : '▶ Empezar partido'}</button>`);
  }
  for(const a of actsArr().filter(a => a.kind === 'pairs' && a.status === 'live')){

    const q = orderOfPlay(a), e = etas(a), next = q.find(x => x.a === mp.id || x.b === mp.id);
    if(next){ const rival = next.a === mp.id ? next.b : next.a; const before = q.indexOf(next);
      return card('Tu próximo partido', a.icon, `≈ ${fmtHM(e[next.key])}`, `vs ${esc(pairName(a, rival))} · ${before} partido${before === 1 ? '' : 's'} antes`, `<button class="btn sm" data-a="open-act" data-id="${a.id}">Ver cuadro →</button>`); }
  }
  const bingo = actsArr().find(a => a.kind === 'bingo' && a.status === 'live' && a.signups.includes(me));
  if(bingo) return card('En marcha', '🎱', 'Bingo', `Ronda ${bingoState(bingo).round} · ¡a por la línea!`, `<button class="btn primary block" style="margin:0" data-a="open-act" data-id="${bingo.id}">Ver mis cartones</button>`);
  const mine = items.find(a => a.kind !== 'event' && a.status !== 'done' && a.signups.includes(me));
  if(mine) return card('Tu próximo plan', mine.icon, esc(mine.name), `${dayLabel(mine.day)} · ${mine.start}`, `<button class="btn sm" data-a="open-act" data-id="${mine.id}">Ver detalles →</button>`);
  const open = items.find(a => a.kind !== 'event' && a.status === 'open');

  return '';
}

// ---------- Pairs ----------
function renderPairsBody(a){

    if(editable && !out) h += [0,1].map(s => `<select id="ps-${pr.id}-${s}" data-c="pair-slot" data-id="${a.id}" data-pair="${pr.id}" data-slot="${s}">${['',...a.signups].map(pid =>

    return h;
  }
  const st = pairStandings(a);
  h += `<h3 class="sec">Clasificación</h3><div class="card"><table><thead><tr><th class="num">#</th><th>Pareja</th><th class="num">PJ</th><th class="num">G</th><th class="num">P</th><th class="num">Dif</th></tr></thead><tbody>
    ${st.map((r,i) => `<tr ${r.p.includes(myId()) ? 'style="background:var(--soft)"' : ''}><td class="num"><b>${i+1}</b></td><td>${esc(pairName(a, r.id))}</td><td class="num">${r.pj}</td><td class="num"><b>${r.w}</b></td><td class="num">${r.l}</td><td class="num">${r.f - r.c > 0 ? '+' : ''}${r.f - r.c}</td></tr>`).join('')}
    </tbody></table></div><h3 class="sec">Partidos</h3>`;
  const ms = Object.values(a.matches || {}).sort((x,y) => x.round - y.round || (x.key < y.key ? -1 : 1));
  [...new Set(ms.map(m => m.round))].forEach(r => { h += `<div class="round-l">Jornada ${r}</div>` + ms.filter(m => m.round === r).map(m => matchCard(a, m)).join(''); });
  return h;
}
function renderBracket(a, R, isPairs){

    const sc = stored?.status === 'done' ? stored.score : null;

      return `<button class="bk-r ${won ? 'w' : ''} ${id === 'BYE' ? 'bye' : ''}" ${canPick ? `data-a="ko-win" data-id="${a.id}" data-key="${m.key}" data-w="${id}"` : ''}><span class="n">${esc(name(id))}</span>${score}</button>`;
    };
    return `<div class="bk-m ${live ? 'live' : ''} ${tap ? 'tap' : ''}" ${tap ? `data-a="open-match" data-aid="${a.id}" data-key="${m.key}"` : ''}>${side('a')}${side('b')}</div>`;
  }).join('')}</div>`).join('')}</div>`;
  if(champ && champ !== 'BYE') h += `<div class="card champ" style="margin:6px 0 0;box-shadow:none">🏆 ${esc(name(champ))}</div>`;

function matchCard(a, m){

// ---------- Match detail ----------

function renderMyCards(a, drawn, auto){

function renderTV(){
  const bingo = actsArr().find(a => a.kind === 'bingo' && a.status === 'live');
  let body = '', title = esc(S.config?.eventName || '');
  if(bingo){
    const b = bingoState(bingo), last = b.drawn[b.drawn.length-1];
    title = '🎱 Bingo · ronda ' + b.round;
    body = `<div class="ball tv-ball">${last ?? '¡Ya!'}</div><div class="prev-balls">${b.drawn.slice(-11,-1).reverse().map(n => `<span style="width:7vh;height:7vh;font-size:3vh">${n}</span>`).join('')}</div>
      <div style="text-align:center">📣 Línea: <b>${roundWinners(b, b.round, 'line').map(shortName).join(', ') || '—'}</b> · 🎉 Bingo: <b>${roundWinners(b, b.round, 'bingo').map(shortName).join(', ') || '—'}</b></div>`;
  } else {
    const slides = [];
    const lives = actsArr().filter(a => a.kind === 'pairs' && a.status === 'live');
    if(lives.length) slides.push(['🎾 En pista y siguientes', lives.map(a => { const e = etas(a); return orderOfPlay(a).slice(0,4).map(x => `<div class="tv-row"><span>${a.matches?.[x.key]?.status === 'live' ? '🔴' : fmtHM(e[x.key])} · ${esc(pairName(a,x.a))} vs ${esc(pairName(a,x.b))}</span><span style="opacity:.6">${esc(x.label)}</span></div>`).join(''); }).join('')]);
    slides.push(['🏆 Campeón del finde', generalRanking().filter(r => !r.guest).slice(0,8).map((r,i) => `<div class="tv-row"><span>${medal(i)} ${pn(r.id)}</span><b style="color:var(--yellow)">${r.pts}</b></div>`).join('')]);
    const tot = {}; feedArr().forEach(d => tot[d.kind] = (tot[d.kind] || 0) + 1);
    const bar = plist().map(p => ({p, n:drinkCount(p.id)})).sort((a,b) => b.n - a.n).slice(0,5);
    slides.push(['🍻 La barra', `<div style="text-align:center;font-size:6vh">${Object.entries(DRINKS).map(([k,d]) => `${d.icon} ${tot[k] || 0}`).join('&nbsp;&nbsp;')}</div>` + bar.map((r,i) => `<div class="tv-row"><span>${medal(i)} ${r.p.emoji} ${esc(r.p.name)}</span><b>${r.n}</b></div>`).join('')]);

  return `<div class="tv"><button class="tv-exit" data-a="tab" data-t="more">Salir</button><h1>${title}</h1><div class="tv-body">${body}</div><div class="tv-foot">${esc(S.config?.eventName || '')} · se actualiza solo</div></div>`;

// Stored as small JPEGs (160×160, ~8 KB) inside data/photos: no paid file storage needed
function photoControls(pid){
  if(!(pid === myId() || canManage(pid))) return '';
  return `<div class="photo-row"><label class="btn sm" style="margin:0;cursor:pointer">📷 ${S.photos[pid] ? 'Cambiar foto' : 'Poner foto'}<input type="file" accept="image/*" data-c="photo" data-pid="${pid}" style="display:none"></label>
    ${S.photos[pid] ? `<button class="btn sm ghost" data-a="photo-del" data-pid="${pid}">Quitar foto</button>` : ''}</div>`;
}
// Center-crops and shrinks the picture so it costs almost nothing to store and download
function resizePhoto(file, size = 160){
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = size;
      const side = Math.min(img.width, img.height), sx = (img.width - side)/2, sy = (img.height - side)/2;
      c.getContext('2d').drawImage(img, sx, sy, side, side, 0, 0, size, size);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('No se pudo leer la imagen')); };
    img.src = url;
  });
}
async function savePhoto(pid, file){
  try {
    const data = await resizePhoto(file);
    try { await DB.update('data/photos', {[`list.${pid}`]: data}); }
    catch(e){ if(e?.code === 'not-found' && isAdmin()) await DB.set('data/photos', {list:{[pid]: data}}); else throw e; }
    if(pid !== myId()) log(`puso foto a ${shortName(pid)}`);
    toast('📷 ¡Foto actualizada!');
  } catch(e){ toast('⚠️ ' + (e.message || 'No se pudo subir la foto')); }
}

function renderModal(){
  const el = document.getElementById('modal');
  if(!UI.modal){ el.className = ''; el.innerHTML = ''; return; }
  el.className = 'open';
  el.innerHTML = `<div class="sheet">${MODALS[UI.modal.kind](UI.modal)}</div>`;
}
const openModal = m => { UI.modal = m; renderModal(); };
const closeModal = () => { UI.modal = null; renderModal(); };

// Toast / snackbar with an optional action ("Deshacer")
let toastTimer;
function toast(msg, action){
  const el = document.getElementById('toast');
  el.innerHTML = `<span>${esc(msg)}</span>${action ? `<button id="toast-act">${esc(action.label)}</button>` : ''}`;
  if(action) document.getElementById('toast-act').onclick = () => { action.fn(); el.classList.remove('show'); };
  el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), action ? 5000 : 2800);
}
function speak(text){ if(!LS.get('rg-voice', false)) return; try { const u = new SpeechSynthesisUtterance(text); u.lang = 'es-ES'; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch(e){} }
const vibrate = () => { try { navigator.vibrate?.(25); } catch(e){} };
// Lightweight confetti
function confetti(){
  const cv = document.getElementById('confetti'), ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ['#D62839','#FFC93C','#1F8A70','#2F6FEB','#ffffff'];
  const parts = Array.from({length:140}, () => ({x:Math.random()*cv.width, y:-20 - Math.random()*cv.height*0.5, vx:(Math.random()-.5)*4, vy:2 + Math.random()*4, s:5 + Math.random()*6, c:colors[Math.floor(Math.random()*colors.length)], r:Math.random()*6}));
  let frames = 0;
  (function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += .1; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); ctx.restore(); });
    if(++frames < 180) requestAnimationFrame(tick); else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

const go = patch => { Object.assign(UI, patch); scheduleRender(); scrollTo(0,0); };
const val = id => (document.getElementById(id)?.value ?? '').trim();
const authMsg = e => ({'auth/email-already-in-use':'Ese nombre ya está cogido', 'auth/invalid-credential':'PIN incorrecto', 'auth/wrong-password':'PIN incorrecto',
  'auth/too-many-requests':'🔒 Demasiados intentos. Espera unos minutos o pídele el PIN al organizador', 'auth/network-request-failed':'Sin conexión. Inténtalo con cobertura'})[e?.code] || ('Error: ' + (e?.code || e?.message));
function playerDoc(o){ return {id:o.id, name:o.name, emoji:o.emoji, level:o.level ?? 3, uid:o.uid ?? null, guest:!!o.guest, host:o.host ?? null, days:o.days || [], driving:!!o.driving, left:false, at:Date.now()}; }

const ACTIONS = {

  tab: d => { if(d.t === 'tv'){ UI.tvSlide = 0; } go({tab:d.t, view:null}); },

  filter: d => { UI.dayFilter = d.f; scheduleRender(); },

  seen: d => { const s = LS.get('rg-seen', {}); s[d.k] = 1; LS.set('rg-seen', s); scheduleRender(); },
  theme: d => { LS.set('rg-theme', d.k); scheduleRender(); },
  install: () => openModal({kind:'install'}),
  'share-link': () => openModal({kind:'share'}),
  copy: d => { const el = document.getElementById(d.t); try { navigator.clipboard.writeText(el.value).then(() => toast('Copiado ✅'), () => { el.select(); toast('Mantén pulsado para copiar'); }); } catch(e){ el.select(); } },
  reveal: d => { UI.reveal[d.i] = true; scheduleRender(); if(+d.i === awards().length - 1) confetti(); },

  // First-time setup: the person who creates the event becomes the organizer
  'do-setup': async () => {
    const name = val('st-me').replace(/\s+/g,' '), id = normKey(name), pin = val('st-pin');
    if(id.length < 2) return toast('Pon tu nombre');
    if(!/^\d{4}$/.test(pin) || pin !== val('st-pin2')) return toast('El PIN debe tener 4 cifras y coincidir');
    const code = val('st-code').toUpperCase(), gcode = val('st-gcode').toUpperCase();
    if(!code || !gcode || code === gcode) return toast('Pon dos códigos distintos');
    try {
      const u = await DB.signUp(emailOf(id), pwOf(pin));
      await DB.set('config/main', defaultConfig({eventName:val('st-name') || 'KH7 Rural Games', dates:val('st-dates'), code, guestCode:gcode, adminUid:u}));
      await DB.set('data/players', {list:{[id]: playerDoc({id, name, emoji:'😎', uid:u, days:['vie','sab','dom']})}});
      await DB.set('data/event', {acts:Object.fromEntries(defaultActs().map(a => [a.id, a])), rules:defaultRules()});
      for(const [p, v] of Object.entries(emptyDocs())) await DB.set(p, v);
      await DB.set('data/photos', {list:{}});
      await DB.set(`pins/${id}`, {pin, uid:u});
      LS.set('rg-code', code); LS.set('rg-first-seen', Date.now()); UI.drafts = {};
      toast('¡Evento creado! Eres el organizador 🔧'); confetti();
    } catch(e){ toast(authMsg(e)); }
  },

  // Login, registration, claim
  'login-code': () => { const c = val('code').toUpperCase(); if(codeOk(c)){ UI.code = c; LS.set('rg-code', c); UI.loginStep = 'pick'; clearDrafts('code'); scheduleRender(); } else toast('Código incorrecto 🤔'); },
  pick: d => { UI.pinFor = d.id; UI.pinBuf = ''; UI.loginStep = 'pin'; scheduleRender(); },
  'login-register': () => { UI.loginStep = 'register'; UI.regDays = isGuestCode(UI.code) ? [] : ['vie','sab','dom']; scheduleRender(); },
  'login-claim': () => { UI.loginStep = 'claim'; scheduleRender(); },

    UI.pinBuf += d.k; scheduleRender();
    if(UI.pinBuf.length === 4) setTimeout(async () => {
      try { await DB.signIn(emailOf(UI.pinFor), pwOf(UI.pinBuf)); UI.pinBuf = ''; UI.loginStep = 'pick'; go({tab:'home', view:null}); toast(`¡Hola, ${shortName(UI.pinFor)}! 👋`); firstSeen(); }
      catch(e){ toast(authMsg(e)); UI.pinBuf = ''; scheduleRender(); }
    }, 120);
  },
  register: async () => {
    const name = val('reg-name').replace(/\s+/g,' '), id = normKey(name), pin = val('reg-pin');
    if(name.length < 2 || id.length < 2) return toast('Pon un nombre de al menos 2 letras');
    if(!/^\d{4}$/.test(pin)) return toast('El PIN tiene que ser de 4 cifras');
    if(pin !== val('reg-pin2')) return toast('Los PIN no coinciden');
    if(P(id)) return toast(`Ya hay alguien registrado como "${P(id).name}"`);
    const guest = isGuestCode(UI.code);
    if(guest && !UI.regDays.length) return toast('Marca qué días estás');
    try {
      const u = await DB.signUp(emailOf(id), pwOf(pin));
      await DB.update('data/players', {[`list.${id}`]: playerDoc({id, name, emoji:UI.newEmoji, uid:u, guest, days:UI.regDays, driving:guest && document.getElementById('reg-drive')?.checked})});

  },
  claim: async () => {
    const id = val('cl-pid'), code = val('cl-code'), pin = val('cl-pin'), p = P(id);
    if(!p?.claimHash) return toast('Ese perfil no se puede recuperar');
    if(await sha256(`${id}|${code}`) !== p.claimHash) return toast('Código incorrecto');
    if(!/^\d{4}$/.test(pin) || pin !== val('cl-pin2')) return toast('El PIN debe tener 4 cifras y coincidir');
    try {
      const u = await DB.signUp(emailOf(id), pwOf(pin));
      await DB.update('data/players', {[`list.${id}.uid`]: u, [`list.${id}.claimHash`]: OP.del()});

      UI.drafts = {}; UI.loginStep = 'pick'; firstSeen(); go({tab:'home', view:null}); toast(`¡Ya estás dentro, ${p.name}! 🎉`);
    } catch(e){ toast(authMsg(e)); }

  'save-pin': async () => {

    try { await DB.changePw(emailOf(myId()), pwOf(oldP), pwOf(newP)); W(DB.set(`pins/${myId()}`, {pin:newP, uid:S.uid})); closeModal(); toast('PIN cambiado 🔑'); }
    catch(e){ toast(e?.code === 'auth/invalid-credential' || e?.code === 'auth/wrong-password' ? 'El PIN actual no es correcto' : authMsg(e)); }
  },

  // Sign-ups (normal, late join, reserve)
  signup: d => {
    const a = act(d.id), me = myId();
    if(a.signups.includes(me)) return;
    const late = d.late === '1';
    if(!late && a.status !== 'open') return toast('La inscripción está cerrada');
    if(!late && a.max && a.signups.length >= a.max) return toast('No quedan plazas');
    actPatch(a.id, {signups: OP.union(me)});
    const clash = actsArr().filter(x => x.id !== a.id && x.kind !== 'event' && x.signups.includes(me) && x.status !== 'done' && overlap(a, x));
    const away = !present(me, a.day);
    vibrate();
    toast(away ? `⚠️ Apuntado, pero marcaste que el ${dayLabel(a.day).toLowerCase()} no estás` : clash.length ? `⚠️ Apuntado, pero coincide con ${clash.map(c => c.name).join(', ')}` : late ? (a.kind === 'pairs' ? '🪑 Estás de reserva' : '⏱ ¡Dentro!') : '¡Apuntado! 💪');
  },
  unsign: d => { actPatch(d.id, {signups: OP.remove(myId())}); toast('Te has quitado'); },
  'persona-signup': d => { const a = act(d.id), on = a.signups.includes(d.pid); actPatch(a.id, {signups: on ? OP.remove(d.pid) : OP.union(d.pid)}); log(`${on ? 'quitó a' : 'apuntó a'} ${shortName(d.pid)} en ${a.name}`); setTimeout(renderModal, 60); },

  // Drinks
  drink: d => quickDrink(myId(), d.k),
  'fab-pick': d => { closeModal(); quickDrink(myId(), d.k); },
  'drink-for': d => { quickDrink(d.id, d.k); setTimeout(renderModal, 60); },
  'drink-del': d => { const x = S.feed[d.id]; upd('data/bar', {[`feed.${d.id}`]: OP.del()}); if(x && x.pid !== myId()) log(`borró una ${DRINKS[x.kind]?.label.toLowerCase()} de ${shortName(x.pid)}`); toast('Borrada'); },

  // People: presence, guests, hosts
  persona: d => openModal({kind:'persona', id:d.id}),
  'day-toggle': d => { const p = P(d.pid), days = p.days?.includes(d.d) ? p.days.filter(x => x !== d.d) : [...(p.days || []), d.d]; upd('data/players', {[`list.${d.pid}.days`]: days}); setTimeout(() => UI.modal ? renderModal() : null, 60); },
  leave: d => {
    const p = P(d.id), left = !p.left;
    upd('data/players', {[`list.${d.id}.left`]: left});
    if(left){
      for(const a of actsArr().filter(a => a.kind === 'poker' && a.status === 'live' && a.signups.includes(d.id) && !a.eliminated.includes(d.id))) actPatch(a.id, {eliminated: OP.union(d.id)});
      log(`marcó que ${p.name} se ha ido`);
      toast(d.id === myId() ? '👋 ¡Hasta la próxima! El organizador se encarga de tus partidos' : `👋 ${p.name} se ha ido`);

    upd('data/players', {[`list.${id}`]: playerDoc({id, name, emoji:val('qg-emoji'), guest:true, host:val('qg-host'), days, driving:document.getElementById('qg-drive').checked})});
    log(`creó el perfil rápido de ${name}`); closeModal(); toast(`🎟️ ${name} creado`);
  },
  'claim-code': async d => {
    const code = String(Math.floor(100000 + Math.random()*900000));
    upd('data/players', {[`list.${d.id}.claimHash`]: await sha256(`${d.id}|${code}`)});
    openModal({kind:'persona', id:d.id, code});

  'del-player': d => openModal({kind:'confirm', title:'¿Borrar persona?', text:`Se quitará a ${shortName(d.id)} de la lista y de las inscripciones.`, action:'del-player-go', id:d.id, ok:'Borrar'}),
  'del-player-go': d => {
    upd('data/players', {[`list.${d.id}`]: OP.del()});
    const patch = {}; actsArr().filter(a => a.signups.includes(d.id)).forEach(a => patch[`acts.${a.id}.signups`] = OP.remove(d.id));
    if(Object.keys(patch).length) upd('data/event', patch);
    log(`borró a ${shortName(d.id)}`); closeModal();
  },
  'load-pins': async () => { try { const l = await DB.list('pins'); UI.pins = Object.fromEntries(l.map(x => [x.id, x.pin])); scheduleRender(); } catch(e){ dbErr(e); } },

  // Organizer
  announce: () => { upd('config/main', {latestVersion:APP_VERSION}); log(`avisó de la versión ${APP_VERSION}`); toast('📣 Aviso enviado a todos'); },
  'set-status': d => { actPatch(d.id, {status:d.s}); log(`cambió ${act(d.id).name} a "${STATUS[d.s].label}"`); },
  draw: d => doDraw(d.id),
  redraw: d => openModal({kind:'confirm', title:'¿Volver a sortear?', text:'Se perderán las parejas actuales (y cualquier cambio manual).', action:'redraw-go', id:d.id, ok:'Sortear de nuevo'}),
  'redraw-go': d => { closeModal(); doDraw(d.id); },
  start: d => {
    const a = clone(act(d.id));
    if(a.pairs.some(p => !p.p[0] || !p.p[1])) return toast('Hay parejas incompletas: complétalas antes de empezar');
    if(a.format === 'bracket') actPatch(a.id, {br:makeBracket(pairsByStrength(a, a.pairs.map(p => p.id))), matches:{}, cons:null, retired:[], status:'live'});
    else { genLeague(a); actPatch(a.id, {matches:a.matches, retired:[], status:'live'}); }
    log(`empezó ${a.name}`); toast('▶ ¡A jugar!');
  },
  'gen-cons': d => { const a = clone(act(d.id)); a.cons = null; maybeGenCons(a); },
  retire: d => openModal({kind:'confirm', title:'¿Retirar pareja?', text:`${pairName(act(d.id), d.pair)}: sus partidos pendientes se darán por perdidos (W.O.).`, action:'retire-go', id:`${d.id}|${d.pair}`, ok:'Retirar'}),
  'retire-go': d => { const [aid, pair] = d.id.split('|'); actPatch(aid, {retired: OP.union(pair)}); log(`retiró a ${pairName(act(aid), pair)} de ${act(aid).name}`); closeModal(); setTimeout(() => { const a = act(aid); if(a) maybeGenCons(a); }, 300); },

  // Matches (result entered at the end)
  'start-match': d => { const a = act(d.aid), t = matchTeams(a, d.key); actPatch(a.id, {[`matches.${d.key}`]: {...(a.matches?.[d.key] || {}), key:d.key, t, status:'live', startedAt:Date.now()}}); toast('🎾 ¡En pista!'); },
  'stop-match': d => { const a = act(d.aid); actPatch(a.id, {[`matches.${d.key}`]: {...a.matches[d.key], status:'pending', startedAt:null}}); },
  'open-result': d => {
    const a = act(d.aid), t = matchTeams(a, d.key); if(!t) return;
    if(isLocked(a, d.key)) return toast('🔒 El siguiente partido ya ha empezado');
    const m = a.matches?.[d.key];
    openModal({kind:'result', aid:a.id, key:d.key, t, score: m?.status === 'done' ? [...m.score] : [0,0], uses: clone(m?.uses || {})});
  },
  stp: d => {
    const m = UI.modal, path = d.p.split('.'), delta = +d.d;
    let o = m; for(const k of path.slice(0,-1)) o = (o[k] ??= {});
    const k = path[path.length-1], next = Math.max(0, (o[k] || 0) + delta);
    if(path[0] === 'uses' && delta > 0){                       // respect the rule's max per match
      const r = S.rules[path[1]], u = m.uses[path[1]][path[2]];
      if(sum(Object.values(u.byPid || {})) + (u.times || 0) + (u.alt || 0) >= r.max) return toast(`Máximo ${r.max} por partido`);
    }
    o[k] = next; renderModal();
  },
  'save-result': () => {
    const md = UI.modal, a = clone(act(md.aid)), [x,y] = md.score;
    if(x === y) return toast('No puede haber empate');
    const prev = a.matches?.[md.key];
    const m = {key:md.key, t:md.t, status:'done', score:[x,y], winner:md.t[x > y ? 0 : 1], uses:md.uses, by:myId(), at:Date.now(), startedAt:prev?.startedAt || null};
    if(a.format === 'league') m.round = prev?.round;
    const drinks = drinksFromUses(a, m, md.uses);
    const extra = {}; (prev?.drinkIds || []).forEach(id => extra[`feed.${id}`] = OP.del());       // editing: replace old drinks
    m.drinkIds = drinks.length || Object.keys(extra).length ? addDrinks(drinks, extra) : [];
    a.matches = {...(a.matches || {}), [md.key]: m};
    actPatch(a.id, {[`matches.${md.key}`]: m});
    log(`${prev?.status === 'done' ? 'corrigió' : 'apuntó'} ${pairName(a, md.t[0])} ${x}–${y} ${pairName(a, md.t[1])} (${a.name})`);
    closeModal(); confetti(); vibrate();
    toast(`🏆 Ganan ${pairName(a, m.winner)}${drinks.length ? ` · ${drinks.length} bebidas a la Barra` : ''}`);
    if(a.format === 'bracket'){ maybeGenCons(a); const R = padelMain(a), fin = R[R.length-1]?.[0]; if(fin?.key === md.key) setTimeout(() => toast(`🏆 ¡${pairName(a, m.winner)} campeones de ${a.name}!`), 2000); }
    go({view:{kind:'activity', id:a.id}});
  },

  // Knockout, tables, poker
  'edit-ko': d => { UI.editKo = UI.editKo === d.id ? null : d.id; scheduleRender(); },
  'ko-win': d => {
    const a = clone(act(d.id)); a.koWin = {...(a.koWin || {}), [d.key]: d.w};
    const R = koRounds(a), champ = R[R.length-1][0].winner, done = champ && champ !== 'BYE';
    actPatch(a.id, {[`koWin.${d.key}`]: d.w, status: done ? 'done' : 'live'});
    if(done){ toast(`🏆 ${pname(champ)} gana ${a.name}`); confetti(); }
  },
  'poker-out': d => {
    const a = act(d.id), alive = a.signups.filter(p => !a.eliminated.includes(p) && p !== d.pid);
    const patch = {eliminated: OP.union(d.pid)};
    if(alive.length === 1){ patch.status = 'done'; patch['timer.running'] = false; toast(`🏆 ${pname(alive[0])} gana el póker`); confetti(); }
    actPatch(a.id, patch);
  },
  'poker-undo': d => actPatch(d.id, {eliminated: act(d.id).eliminated.slice(0,-1), status:'live'}),
  timer: d => {
    const t = {...act(d.id).timer};
    if(d.op === 'toggle'){ if(t.running){ t.remaining = timerRemaining(t); t.running = false; } else { t.startedAt = Date.now(); t.running = true; } }
    else { t.level = Math.max(0, Math.min(BLINDS.length-1, t.level + (d.op === 'next' ? 1 : -1))); t.remaining = LEVEL_SECONDS; t.startedAt = Date.now(); }
    actPatch(d.id, {timer:t});
  },

  // Bingo (runtime state lives in the small data/live document)
  'bingo-cards': d => actPatch(d.id, {[`cards.${myId()}`]: +d.n}),
  'bingo-draw': d => bingoDraw(d.id),
  'bingo-auto': d => {
    if(UI.autoDraw === d.id){ clearInterval(UI.autoTimer); UI.autoDraw = null; }
    else { clearInterval(UI.autoTimer); UI.autoDraw = d.id; bingoDraw(d.id); UI.autoTimer = setInterval(() => bingoDraw(d.id), 8000); }
    scheduleRender();
  },
  'bingo-round': d => { const b = bingoState(act(d.id)); stopAuto(); upd('data/live', {[`bingo.${d.id}`]: {round:b.round + 1, drawn:[], claims:b.claims || []}}); toast('🔄 ¡Nueva ronda! Cartones nuevos'); },
  'bingo-mark': d => {
    if(LS.get('rg-automark', true)) return toast('Tienes activado "Marcar solo"');
    const a = act(d.id), key = marksKey(a, +d.k), s = new Set(LS.get(key, []));
    s.has(+d.n) ? s.delete(+d.n) : s.add(+d.n); LS.set(key, [...s]); scheduleRender();
  },
  'bingo-claim': d => {
    const a = act(d.id), b = bingoState(a), set = new Set(b.drawn);
    const ok = cardsOf(a, myId()).some(c => c.grid && (d.t === 'line' ? lineDone(c.grid, set) : fullDone(c.grid, set)));
    upd('data/live', {[`bingo.${a.id}.claims`]: OP.union({id:uid(), pid:myId(), type:d.t, round:b.round, at:b.drawn.length, ok})});
    if(ok){ confetti(); if(d.t === 'bingo') stopAuto(); }
  },

  // Shopping
  'shop-add': () => {
    const name = val('sh-name'); if(!name) return toast('Escribe qué hay que comprar');
    const price = parseFloat(val('sh-price').replace(',', '.')), id = 's' + uid();
    upd('data/social', {[`shop.${id}`]: {id, name, qty:val('sh-qty'), price: isNaN(price) ? null : price, who:null, done:false, by:myId(), at:Date.now()}});
    clearDrafts('sh-name','sh-qty','sh-price'); toast('Añadido 🛒');
  },
  'shop-done': d => upd('data/social', {[`shop.${d.id}.done`]: !S.shop[d.id].done}),
  'shop-del': d => { const it = S.shop[d.id]; upd('data/social', {[`shop.${d.id}`]: OP.del()}); toast('Borrado', {label:'Deshacer', fn: () => upd('data/social', {[`shop.${d.id}`]: it})}); },
  'est-to-list': () => {
    const patch = {};
    for(const e of shopEstimate()){ if(!e.n) continue; const qty = `${e.n} ${e.unit}`; if(S.shop[e.id]) patch[`shop.${e.id}.qty`] = qty; else patch[`shop.${e.id}`] = {id:e.id, name:e.name, qty, price:null, who:null, done:false, by:myId(), at:Date.now()}; }

  // Suggestions
  'sugg-add': () => {
    const title = val('sg-title'); if(title.length < 3) return toast('Ponle un nombre a tu idea');
    const id = 'g' + uid();
    upd('data/social', {[`sugg.${id}`]: {id, title, desc:val('sg-desc'), by:myId(), votes:[myId()], status:'new', at:Date.now()}});
    clearDrafts('sg-title','sg-desc'); toast('💡 ¡Gracias! El organizador la verá');
  },
  'sugg-vote': d => { const s = S.sugg[d.id]; upd('data/social', {[`sugg.${d.id}.votes`]: s.votes?.includes(myId()) ? OP.remove(myId()) : OP.union(myId())}); vibrate(); },
  'sugg-convert': d => { const s = S.sugg[d.id]; openModal({kind:'act', sid:s.id, prefill:{name:s.title, desc:s.desc}}); },
  'sugg-del': d => openModal({kind:'confirm', title:'¿Borrar sugerencia?', text:'Desaparecerá para todos.', action:'sugg-del-go', id:d.id, ok:'Borrar'}),
  'sugg-del-go': d => { upd('data/social', {[`sugg.${d.id}`]: OP.del()}); closeModal(); },

  // Activities & rules CRUD
  'add-act': () => openModal({kind:'act'}),
  'save-act': d => {
    const name = val('f-name'); if(!name) return toast('Ponle nombre');

    const a = mkAct({id:'a-' + uid(), kind, ...(sport ? {sport} : {}), name, icon:val('f-icon') || '🎯', desc:val('f-desc'), day:val('f-day'), start:val('f-start'), end:val('f-end')});

  'del-act': d => openModal({kind:'confirm', title:'¿Borrar actividad?', text:`Se borrará "${act(d.id).name}" con sus inscripciones y resultados.`, action:'del-act-go', id:d.id, ok:'Borrar'}),
  'del-act-go': d => { log(`borró la actividad ${act(d.id)?.name}`); upd('data/event', {[`acts.${d.id}`]: OP.del()}); closeModal(); },
  'add-rule': () => openModal({kind:'rule'}),
  'edit-rule': d => openModal({kind:'rule', id:d.id}),
  'save-rule': d => {
    const name = val('r-name'); if(!name) return toast('Ponle nombre a la regla');
    const sports = [...document.querySelectorAll('.r-sport:checked')].map(x => x.value);
    if(!sports.length) return toast('Elige al menos un juego');

  'del-rule-go': d => { upd('data/event', {[`rules.${d.id}`]: OP.del()}); closeModal(); },
  'load-defaults': () => { const patch = {}; defaultActs().filter(x => !S.acts[x.id]).forEach(a => patch[`acts.${a.id}`] = a); upd('data/event', patch); toast('Torneos recuperados'); },

  // Backups, log, wipe
  'backup-now': () => backup(true),
  'backup-list': async () => { try { const l = (await DB.list('backups')).sort((a,b) => b.at - a.at).slice(0,15); openModal({kind:'backups', list:l}); } catch(e){ dbErr(e); } },
  restore: async d => {
    try {
      const b = (await DB.list('backups')).find(x => x.id === d.id); if(!b) return;
      await backup(false);
      const snap = JSON.parse(b.json);
      for(const [p, v] of Object.entries(snap.docs)) await DB.set(p, v);
      log(`restauró la copia del ${fmtTime(b.at)}`); closeModal(); toast('♻️ Copia restaurada');
    } catch(e){ dbErr(e); }
  },
  'backup-download': async () => {
    const snap = await snapshot(), blob = new Blob([JSON.stringify(snap, null, 1)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `kh7-rural-games-${new Date().toISOString().slice(0,16)}.json`; document.body.appendChild(a); a.click(); a.remove();
  },
  'load-log': async () => { try { const d = await DB.get('data/log'); UI.logItems = Object.values(d?.items || {}).sort((a,b) => b.at - a.at); scheduleRender(); } catch(e){ dbErr(e); } },
  wipe: () => openModal({kind:'confirm', title:'🧨 Borrar todo', text:'Se borran actividades, resultados, bebidas, compra y sugerencias. Los jugadores se mantienen. Antes se guarda una copia.', action:'wipe-go', typed:'BORRAR', ok:'Borrar todo'}),
  'wipe-go': async () => {
    if(val('cf-typed') !== 'BORRAR') return toast('Escribe BORRAR para confirmar');
    await backup(false);
    await DB.set('data/event', {acts:Object.fromEntries(defaultActs().map(a => [a.id, a])), rules:defaultRules()});
    for(const [p, v] of Object.entries(emptyDocs())) await DB.set(p, v);
    closeModal(); toast('Evento reiniciado (hay copia de seguridad)');
  },
  'photo-del': d => { upd('data/photos', {[`list.${d.pid}`]: OP.del()}); toast('Foto quitada'); },
  'close-modal': () => closeModal(),
};

  score: (d,v) => actPatch(d.id, {[`scores.${d.pid}`]: v === '' ? OP.del() : Number(v)}),
