  'guest-flag': (d,v,el) => upd('data/players', {[`list.${d.pid}.guest`]: el.checked}),
  host: (d,v) => upd('data/players', {[`list.${d.pid}.host`]: v || null}),
  ev: (d,v) => { if(v.trim() || d.f === 'albumUrl') upd('config/main', {[d.f]: ['code','guestCode'].includes(d.f) ? v.trim().toUpperCase() : v.trim()}); },
  'cfg-bool': (d,v,el) => { upd('config/main', {[d.f]: el.checked}); if(d.f === 'maintenance') toast(el.checked ? '🔧 Mantenimiento activado' : '✅ App abierta de nuevo'); },
  'gala-open': (d,v,el) => upd('config/main', {galaOpen: el.checked}),
  cfg: (d,v) => actPatch(d.id, {[`cfg.${d.f}`]: Math.max(1, Number(v) || 1)}),
  'act-field': (d,v) => actPatch(d.id, {[d.f]: d.f === 'max' ? (v ? Number(v) : null) : d.f === 'weight' ? Math.max(0, Number(v) || 0) : d.f === 'higher' ? v === '1' : v}),
  'pair-slot': (d,v) => {
    const a = clone(act(d.id)), pr = a.pairs.find(p => p.id === d.pair), s = Number(d.slot), old = pr.p[s] ?? null;

    pr.p[s] = v || null;
    actPatch(a.id, {pairs:a.pairs});
    if(a.status === 'live') log(`cambió jugadores en ${a.name}: entra ${shortName(v)}${old ? ' por ' + shortName(old) : ''}`);
  },
  'ko-slot': (d,v) => { const a = act(d.id), ko = clone(a.ko); ko.slots[+d.i] = v; actPatch(a.id, {ko}); },
  'to-table': (d,v) => { if(v === '') return; const a = clone(act(d.id)); a.tables[+v].ps.push(d.pid); actPatch(a.id, {tables:a.tables}); },
  forecast: (d,v) => { const cur = S.fc[myId()] || {}; upd('data/social', {[`fc.${myId()}`]: {beer:+cur.beer||0, cubata:+cur.cubata||0, shot:+cur.shot||0, [d.k]: Math.max(0, Number(v) || 0)}}); },
  'shop-who': (d,v) => upd('data/social', {[`shop.${d.id}.who`]: v || null}),
  'shop-ratio': (d,v) => upd('config/main', {[`shop.${d.k}`]: Math.max(d.k === 'margin' ? 0 : 1, Number(v) || 0)}),
  'sugg-status': (d,v) => upd('data/social', {[`sugg.${d.id}.status`]: v}),
  'dev-toggle': (d,v,el) => { LS.set(d.k, el.checked); scheduleRender(); },
  photo: (d,v,el) => { const f = el.files?.[0]; if(f) savePhoto(d.pid, f); },
};

/* ---------- Helpers used by actions ---------- */
function firstSeen(){ if(!LS.get('rg-first-seen')) LS.set('rg-first-seen', Date.now()); }
function doDraw(id){
  const a = clone(act(id));
  if(a.signups.length < 2 && !['score','trivial','bingo','poker'].includes(a.kind)) return toast('Hace falta más gente apuntada');
  if(a.kind === 'pairs'){ a.signups = a.signups.filter(pid => present(pid, a.day)); drawPairs(a); actPatch(id, {pairs:a.pairs, matches:{}, br:null, cons:null, retired:[], status:'drawn'}); }
  else if(a.kind === 'knockout') actPatch(id, {ko:makeBracket(shuffle(a.signups.filter(pid => present(pid, a.day)))), koWin:{}, status:'live'});
  else if(a.kind === 'tables'){ a.signups = a.signups.filter(pid => present(pid, a.day)); genTables(a); actPatch(id, {tables:a.tables, vp:{}, status:'live'}); }
  else {
    actPatch(id, {status:'live'});
    if(a.kind === 'bingo') upd('data/live', {[`bingo.${id}`]: {round:1, drawn:[], claims:[]}});
  }
  log(`sorteó/empezó ${a.name}`);
  toast(['pairs','knockout','tables'].includes(a.kind) ? '🎲 ¡Sorteo hecho! (solo entran los que están ese día)' : '▶ ¡Empezamos!');
}
function bingoDraw(id){
  const a = act(id); if(!a || a.status !== 'live') return stopAuto();
  const b = bingoState(a);
  if(roundWinners(b, b.round, 'bingo').length) return stopAuto();
  const left = Array.from({length:90}, (_,i) => i+1).filter(n => !b.drawn.includes(n));
  if(!left.length) return stopAuto();
  upd('data/live', {[`bingo.${id}.drawn`]: OP.union(left[Math.floor(Math.random()*left.length)])});
}
function stopAuto(){ if(UI.autoDraw){ clearInterval(UI.autoTimer); UI.autoDraw = null; scheduleRender(); } }
async function snapshot(){
  const docs = {};
  for(const p of ['config/main','data/players','data/event','data/bar','data/social','data/live','data/log','data/photos']) docs[p] = await DB.get(p);
  return {at:Date.now(), version:APP_VERSION, docs};
}
async function backup(manual){
  try {
    const snap = await snapshot(), id = 'b' + Date.now();
    await DB.set(`backups/${id}`, {at:snap.at, by:myId(), json:JSON.stringify(snap)});
    upd('config/main', {lastBackup:snap.at});
    if(manual) toast('💾 Copia guardada');
  } catch(e){ if(manual) dbErr(e); }
}

/* ---------- Global event wiring ---------- */
document.addEventListener('click', e => {
  if(e.target.id === 'modal'){ closeModal(); return; }
  const el = e.target.closest('[data-a]');
  if(!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.a];
  if(fn){ e.preventDefault(); e.stopPropagation(); fn({...el.dataset}, el); }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-c]');
  if(el && CHANGES[el.dataset.c]) CHANGES[el.dataset.c]({...el.dataset}, el.value, el);
});
document.addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  const map = {code:'login-code', 'sh-name':'shop-add', 'sh-price':'shop-add', 'sg-title':'sugg-add'};
  if(map[e.target.id]) ACTIONS[map[e.target.id]]({});
});
// Floating drink button: tap = beer, long press = choose drink
(() => {
  const fab = document.getElementById('fab'); let timer = null, long = false;
  const start = () => { long = false; timer = setTimeout(() => { long = true; vibrate(); openModal({kind:'drinkpick'}); }, 450); };
  const end = e => { clearTimeout(timer); if(!long){ quickDrink(myId(), 'beer'); } e.preventDefault(); };
  fab.addEventListener('pointerdown', start);
  fab.addEventListener('pointerup', end);
  fab.addEventListener('pointerleave', () => clearTimeout(timer));
  fab.addEventListener('contextmenu', e => e.preventDefault());
})();

// Timers: poker clock, TV rotation, theme check, hourly automatic backup
setInterval(() => {
  const el = document.getElementById('poker-clock'); if(!el) return;
  const a = act(el.dataset.id); if(!a) return;
  const t = a.timer, rem = timerRemaining(t);
  el.textContent = fmtClock(rem);
  if(t.running && rem <= 0 && isAdmin() && t.level < BLINDS.length - 1){ actPatch(a.id, {timer:{...t, level:t.level + 1, remaining:LEVEL_SECONDS, startedAt:Date.now()}}); toast('⬆️ ¡Suben las ciegas!'); }
}, 1000);
setInterval(() => { if(UI.tab === 'tv'){ UI.tvSlide++; scheduleRender(); } }, 12000);
setInterval(() => { applyTheme(); if(isAdmin() && DB.mode === 'firebase' && Date.now() - (S.config?.lastBackup || 0) > 3600e3) backup(false); }, 5*60e3);

/* =====================================================================
   BOOT: auth state → subscribe to the documents this person may read.
   Listeners are paused while the app is in the background (saves reads).
   ===================================================================== */
const bingoSeen = {};
function onLive(d){
  const all = d?.bingo || {};
  for(const [id, b] of Object.entries(all)){
    const prev = bingoSeen[id], cur = {round:b.round, drawn:(b.drawn || []).length, claims:(b.claims || []).length};
    if(prev){
      if(cur.round === prev.round && cur.drawn > prev.drawn) speak(String(b.drawn[b.drawn.length-1]));
      if(cur.claims > prev.claims){
        const c = b.claims[b.claims.length-1];
        toast(c.ok ? `${c.type === 'line' ? '📣 ¡LÍNEA!' : '🎉 ¡BINGO!'} ${pname(c.pid)}` : `😅 ${pname(c.pid)} ha cantado ${c.type === 'line' ? 'línea' : 'bingo'} en falso. ¡Chupito!`);
        if(c.ok){ speak(`${c.type === 'line' ? 'Línea' : 'Bingo'} de ${shortName(c.pid)}`); if(c.pid !== myId()) confetti(); }
      }
    }
    bingoSeen[id] = cur;
  }
  S.live = all;
}
const HANDLERS = {
  'config/main': d => { S.config = d; },
  'data/players': d => { S.players = d?.list || {}; S.got.add('players'); },
  'data/event': d => { S.acts = d?.acts || {}; S.rules = d?.rules || {}; },
  'data/bar': d => { S.feed = d?.feed || {}; },
  'data/social': d => { S.shop = d?.shop || {}; S.sugg = d?.sugg || {}; S.fc = d?.fc || {}; },
  'data/live': onLive,
  'data/photos': d => { S.photos = d?.list || {}; },
};
let unsubs = [];
function subscribe(){
  unsubs.forEach(u => u()); unsubs = [];
  const paths = ['config/main', 'data/players', ...(S.uid ? ['data/event','data/bar','data/social','data/live','data/photos'] : [])];
  for(const p of paths) unsubs.push(DB.listen(p, d => { HANDLERS[p](d); scheduleRender(); }));
}
document.addEventListener('visibilitychange', () => {
  if(!DB) return;
  if(document.hidden && UI.tab !== 'tv'){ unsubs.forEach(u => u()); unsubs = []; }
  else if(!unsubs.length) subscribe();
});

async function boot(){
  scheduleRender();
  try { DB = FIREBASE_CONFIG ? await makeFirebaseAdapter(FIREBASE_CONFIG) : makeLocalAdapter(); }
  catch(e){ $app.innerHTML = `<div class="maint"><div style="font-size:60px">📡</div><h2>Sin conexión</h2><p class="muted">No se pudo conectar. Revisa tu cobertura y recarga.</p><button class="btn" data-a="reload">Reintentar</button></div>`; return; }
  if(DB.mode === 'demo' && DB.fresh) await seedDemo();
  DB.onAuth(u => { S.uid = u; subscribe(); scheduleRender(); });
  if('serviceWorker' in navigator && location.protocol === 'https:' && DB.mode === 'firebase') navigator.serviceWorker.register('sw.js').catch(() => {});
}
boot();
</script>
